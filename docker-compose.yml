services:
  postgres:
    image: postgres:16
    container_name: papo-postgres
    environment:
      POSTGRES_DB: partnerportal
      POSTGRES_USER: partnerportal
      POSTGRES_PASSWORD: partnerportal
    ports:
      - "5432:5432"
    volumes:
      - papo-postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: papo-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./backend/src/main/resources/keycloak/partnerportal-realm.json:/opt/keycloak/data/import/partnerportal-realm.json
      # End-customer realm (add-shop-customer-accounts); verification mails go to Mailpit.
      - ./backend/src/main/resources/keycloak/papo-shop-realm.json:/opt/keycloak/data/import/papo-shop-realm.json
      # PAPO login theme of the papo-shop realm; start-dev does not cache themes, edits show on reload.
      - ./deploy/keycloak/themes/papo:/opt/keycloak/themes/papo:ro

  # Dev-only mail catcher for order e-mails (send-order-emails): SMTP 1025, web UI
  # http://localhost:8025. Bound to loopback so it is not reachable from the network.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: papo-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  papo-postgres-data:
