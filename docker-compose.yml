version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: papo-postgres
    environment:
      POSTGRES_DB: partnerportal
      POSTGRES_USER: partnerportal
      POSTGRES_PASSWORD: partnerportal
    ports:
      - "5432:5432"
    volumes:
      - papo-postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: papo-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./backend/src/main/resources/keycloak/partnerportal-realm.json:/opt/keycloak/data/import/partnerportal-realm.json

volumes:
  papo-postgres-data:
