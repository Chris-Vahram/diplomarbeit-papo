# PAPO login theme for the end-customer realm papo-shop (add-shop-customer-accounts).
# Built on Keycloak's plain "base" theme (no PatternFly), so only PAPO's own CSS applies.
# Class names below are the hooks the base templates print; papo.css styles them.
parent=base
locales=de

styles=css/papo.css
meta=viewport==width=device-width,initial-scale=1 color-scheme==light

kcHtmlClass=papo
kcBodyClass=papo-body
kcLoginClass=papo-page
kcFormCardClass=papo-card
kcFormHeaderClass=papo-card__head

kcFormClass=papo-form
kcFormGroupClass=papo-group
kcFormSettingClass=papo-group--settings
kcFormOptionsClass=papo-options
kcFormOptionsWrapperClass=papo-options__links
kcFormButtonsClass=papo-buttons
kcFormButtonsWrapperClass=papo-buttons
kcLabelWrapperClass=papo-label-wrap
kcLabelClass=papo-label
kcInputWrapperClass=papo-input-wrap
kcInputClass=papo-input
kcInputGroup=papo-input-group
kcInputErrorMessageClass=papo-error
kcInputHelperTextBeforeClass=papo-help
kcInputHelperTextAfterClass=papo-help
kcContentWrapperClass=papo-row
kcSignUpClass=papo-signup
kcInfoAreaWrapperClass=papo-signup__inner

kcButtonClass=papo-button
kcButtonPrimaryClass=papo-button--primary
kcButtonDefaultClass=papo-button--secondary
kcButtonBlockClass=papo-button--block
kcButtonLargeClass=papo-button--large

kcFormPasswordVisibilityButtonClass=papo-eye-button
kcFormPasswordVisibilityIconShow=papo-eye papo-eye--show
kcFormPasswordVisibilityIconHide=papo-eye papo-eye--hide

kcAlertClass=papo-alert
kcAlertTitleClass=papo-alert__text kc-feedback-text
kcResetFlowIcon=papo-restart

kcInputClassCheckbox=papo-check
kcInputClassCheckboxInput=papo-check__input
kcInputClassCheckboxLabel=papo-check__label
kcInputClassRadio=papo-check
kcInputClassRadioInput=papo-check__input
kcInputClassRadioLabel=papo-check__label
