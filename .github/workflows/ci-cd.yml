name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run tests
        working-directory: backend
        run: ./mvnw --batch-mode test

  build-and-push:
    name: Build and push image to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Package (skip tests - already verified by the test job)
        working-directory: backend
        run: ./mvnw --batch-mode package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires the full image path to be lowercase; github.repository_owner keeps
      # its original casing (e.g. "Chris-Vahram"), which docker/build-push-action rejects
      # outright ("repository name must be lowercase"). GitHub Actions expressions have no
      # built-in lower() function, so do it in a shell step and reuse the result below.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backend" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/src/main/docker/Dockerfile.jvm
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    name: Deploy to production VM
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uploads into a scratch dir named after the commit, never `current` - if this step
      # fails partway, the half-written release is simply never symlinked and frontend-live
      # (still serving traffic via `current`) is completely untouched.
      #
      # source: "frontend/*" expands to paths like "frontend/index.html"; appleboy/scp-action
      # preserves that leading "frontend/" segment under target by default (it tars the
      # matched paths and extracts them remotely as-is), so without strip_components the
      # files would land in .../releases/<sha>/frontend/... instead of .../releases/<sha>/.
      # strip_components: 1 drops that one leading path element on extraction.
      - name: Sync frontend to VM (release dir)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: papo
          key: ${{ secrets.VM_SSH_KEY }}
          fingerprint: ${{ vars.VM_HOST_FINGERPRINT }}
          source: "frontend/*"
          target: "~/papo-deploy/frontend-live/releases/${{ github.sha }}"
          strip_components: 1
          rm: true

      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: papo
          key: ${{ secrets.VM_SSH_KEY }}
          fingerprint: ${{ vars.VM_HOST_FINGERPRINT }}
          script: |
            cd ~/papo-deploy/frontend-live
            # Caddy bind-mounts this frontend-live/ dir itself (docker-compose.prod.yml),
            # never a directory we replace wholesale - a bind mount is resolved once at
            # container start, so swapping out the mounted path under a running container
            # leaves it pointing at the old, now-orphaned inode (empty from Caddy's view).
            # Only the `current` symlink inside the (stable) mounted dir moves, and Caddy
            # resolves that symlink fresh on every request - no container recreate needed.
            #
            # `mv -T` onto an existing symlink is a single rename(2), so `current` never
            # points at a missing or partial target.
            ln -sfn "releases/${{ github.sha }}" current.tmp
            mv -T current.tmp current
            # Keep the last 5 releases; older ones are no longer reachable via `current`.
            ls -1dt releases/*/ | tail -n +6 | xargs -r rm -rf
            cd ~/papo-deploy
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
