name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run tests
        working-directory: backend
        run: ./mvnw --batch-mode test

  build-and-push:
    name: Build and push image to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Package (skip tests - already verified by the test job)
        working-directory: backend
        run: ./mvnw --batch-mode package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires the full image path to be lowercase; github.repository_owner keeps
      # its original casing (e.g. "Chris-Vahram"), which docker/build-push-action rejects
      # outright ("repository name must be lowercase"). GitHub Actions expressions have no
      # built-in lower() function, so do it in a shell step and reuse the result below.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backend" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/src/main/docker/Dockerfile.jvm
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    name: Deploy to production VM
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uploads into a scratch dir, never the live one - if this step fails partway,
      # frontend-new is left incomplete but frontend/ (still serving traffic) is
      # completely untouched. rm:true only ever wipes the scratch dir, which is a
      # from-scratch mirror of the repo on every run anyway, so nothing of value is
      # ever lost by wiping it first.
      - name: Sync frontend to VM (staging dir)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: papo
          key: ${{ secrets.VM_SSH_KEY }}
          fingerprint: ${{ vars.VM_HOST_FINGERPRINT }}
          source: "frontend/*"
          target: "~/papo-deploy/frontend-new"
          rm: true

      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: papo
          key: ${{ secrets.VM_SSH_KEY }}
          fingerprint: ${{ vars.VM_HOST_FINGERPRINT }}
          script: |
            cd ~/papo-deploy
            # Atomic-ish swap: only reached if the scp step above fully succeeded
            # (default fail-fast job behaviour), so frontend-new is always complete
            # here. Two sequential renames on the same filesystem - sub-millisecond,
            # no window where frontend/ is missing or partially written.
            rm -rf frontend-old
            mv frontend frontend-old
            mv frontend-new frontend
            rm -rf frontend-old
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
