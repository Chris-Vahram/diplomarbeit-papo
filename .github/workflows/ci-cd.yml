name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run tests
        working-directory: backend
        run: ./mvnw --batch-mode test

  build-and-push:
    name: Build and push image to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Package (skip tests - already verified by the test job)
        working-directory: backend
        run: ./mvnw --batch-mode package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires the full image path to be lowercase; github.repository_owner keeps
      # its original casing (e.g. "Chris-Vahram"), which docker/build-push-action rejects
      # outright ("repository name must be lowercase"). GitHub Actions expressions have no
      # built-in lower() function, so do it in a shell step and reuse the result below.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backend" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/src/main/docker/Dockerfile.jvm
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    name: Deploy to production VM
    needs: build-and-push
    # TEMPORARILY DISABLED: VM-side deploy prerequisites not done yet (tasks.md
    # 3.5 GHCR privacy, 5.2-5.4 SSH/GitHub/GHCR credentials and 5.6 VM-local
    # state). Re-enable by restoring the line below once those land.
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Transfer and activate exact release
        shell: bash
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST_FINGERPRINT: ${{ vars.VM_HOST_FINGERPRINT }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          SSH_DIR="$RUNNER_TEMP/papo-ssh"
          SSH_KEY="$SSH_DIR/deploy-key"
          KNOWN_HOSTS="$SSH_DIR/known_hosts"
          RELEASE_ARCHIVE="$RUNNER_TEMP/papo-release.tar"
          trap 'rm -rf "$SSH_DIR"; rm -f "$RELEASE_ARCHIVE"' EXIT
          install -m 700 -d "$SSH_DIR"
          printf '%s\n' "$VM_SSH_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"

          ssh-keyscan -t ed25519 "$VM_HOST" > "$KNOWN_HOSTS" 2>/dev/null
          [ "$(wc -l < "$KNOWN_HOSTS")" -eq 1 ]
          ACTUAL_FINGERPRINT="$(ssh-keygen -lf "$KNOWN_HOSTS" -E sha256 | awk 'NR == 1 { print $2 }')"
          [ "$ACTUAL_FINGERPRINT" = "$VM_HOST_FINGERPRINT" ]
          chmod 600 "$KNOWN_HOSTS"

          SSH_OPTIONS=(-i "$SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$KNOWN_HOSTS" -o StrictHostKeyChecking=yes)
          git archive --format=tar "$RELEASE_SHA" -- docker-compose.prod.yml deploy frontend > "$RELEASE_ARCHIVE"
          [ "$(wc -c < "$RELEASE_ARCHIVE")" -le 26214400 ]

          ssh "${SSH_OPTIONS[@]}" "papo-deploy@$VM_HOST" "upload $RELEASE_SHA" < "$RELEASE_ARCHIVE"
          ssh "${SSH_OPTIONS[@]}" "papo-deploy@$VM_HOST" "activate $RELEASE_SHA"
