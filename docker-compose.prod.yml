# Production topology (design.md): single VM, four containers, Caddy fronting everything.
# Separate from the dev-only docker-compose.yml (which only runs Postgres + Keycloak for
# `mvnw quarkus:dev`). Run with:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# .env.prod is VM-local and gitignored - copy .env.prod.example and fill in real values.
#
# mem_limit values are a starting budget for the VM's 7.6 GB (design.md Decision 2 - the
# provider changed from the originally-planned 12 GB Oracle box; see proposal.md) - adjust
# if observed usage differs.
#
# `name:` and the `papo-prod-*` container names are deliberate: the dev-only
# docker-compose.yml uses plain `papo-postgres`/`papo-keycloak` container names and (absent
# an explicit project name) the same default project namespace, since both files live in
# this same directory. Without disambiguation here, running this file locally recreates -
# and detaches from - the dev stack's containers (same postgres volume, different config).
name: papo-prod
services:
  postgres:
    image: postgres:16
    container_name: papo-prod-postgres
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_DB: partnerportal
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - papo-postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: papo-prod-keycloak
    restart: unless-stopped
    mem_limit: 1024m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME: ${DOMAIN}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      DOMAIN: ${DOMAIN}
      # End-customer realm papo-shop (add-shop-customer-accounts): imported only with this
      # secret set (render-and-start.sh). Keycloak sends verification and reset mails itself
      # with the shared SMTP data; port 465 needs SHOP_SMTP_SSL=true and SHOP_SMTP_STARTTLS=false.
      SHOP_ADMIN_CLIENT_SECRET: ${SHOP_ADMIN_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SHOP_SMTP_SSL: ${SHOP_SMTP_SSL:-false}
      SHOP_SMTP_STARTTLS: ${SHOP_SMTP_STARTTLS:-true}
    volumes:
      - ./deploy/keycloak/partnerportal-realm.prod.json.template:/opt/keycloak/partnerportal-realm.json.template:ro
      - ./deploy/keycloak/papo-shop-realm.prod.json.template:/opt/keycloak/papo-shop-realm.json.template:ro
      - ./deploy/keycloak/render-and-start.sh:/opt/keycloak/render-and-start.sh:ro
    # Render the realm template with the real DOMAIN before importing it (design.md
    # Decision 4 status note: redirectUris/webOrigins/KC_HOSTNAME must come from one
    # source of truth, never a hardcoded/stale placeholder).
    entrypoint: ["/bin/sh", "/opt/keycloak/render-and-start.sh"]

  backend:
    image: ghcr.io/chris-vahram/diplomarbeit-papo-backend:${IMAGE_TAG:-latest}
    container_name: papo-prod-backend
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/partnerportal
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Internal address: fast container-to-container JWKS/token-introspection calls,
      # no round-trip through Caddy. The externally-visible issuer is set separately
      # below (see application.properties %prod.quarkus.oidc.token.issuer).
      KC_URL: http://keycloak:8080/auth/realms/partnerportal
      KC_ISSUER: https://${DOMAIN}/auth/realms/partnerportal
      KC_CLIENT_ID: partnerportal-frontend
      # Opt-in demo data seed (partners/products/enablements/orders) under LaunchMode.NORMAL -
      # off unless set true in .env.prod (docs/DEPLOYMENT.md); never bake true into the image.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Public partner shops (/shop/*, /api/shop/*): off until the shop legal texts are live
      # (add-shop-legal-consent); enable only deliberately in .env.prod (docs/DEPLOYMENT.md).
      SHOP_PUBLIC_ENABLED: ${SHOP_PUBLIC_ENABLED:-false}
      # Optional end-customer accounts (add-shop-customer-accounts): off until SMTP works and
      # the papo-shop realm is imported. Tenant papo-shop only serves /api/shop-customer/*.
      SHOP_ACCOUNTS_ENABLED: ${SHOP_ACCOUNTS_ENABLED:-false}
      KC_SHOP_URL: http://keycloak:8080/auth/realms/papo-shop
      KC_SHOP_ISSUER: https://${DOMAIN}/auth/realms/papo-shop
      SHOP_ADMIN_KEYCLOAK_URL: http://keycloak:8080/auth
      SHOP_ADMIN_CLIENT_SECRET: ${SHOP_ADMIN_CLIENT_SECRET:-}
      # staging | production (add-shop-legal-consent). production refuses shop releases and
      # takes shops offline while a company legal text is missing; staging allows placeholders.
      PAPO_ENVIRONMENT: ${PAPO_ENVIRONMENT:-staging}
      # Order e-mails (send-order-emails): off unless enabled in .env.prod. Without
      # PAPO_MAIL_REDIRECT_TO the app refuses to start unless PAPO_MAIL_ALLOW_REAL_RECIPIENTS=true.
      PAPO_MAIL_ENABLED: ${PAPO_MAIL_ENABLED:-false}
      PAPO_MAIL_FROM: ${PAPO_MAIL_FROM:-}
      PAPO_MAIL_REDIRECT_TO: ${PAPO_MAIL_REDIRECT_TO:-}
      PAPO_MAIL_ALLOW_REAL_RECIPIENTS: ${PAPO_MAIL_ALLOW_REAL_RECIPIENTS:-false}
      PAPO_MAIL_SHIPPING_ENABLED: ${PAPO_MAIL_SHIPPING_ENABLED:-false}
      # Never empty: an empty value would clear Quarkus' default and block startup even with mail off.
      QUARKUS_MAILER_HOST: ${SMTP_HOST:-localhost}
      QUARKUS_MAILER_PORT: ${SMTP_PORT:-587}
      QUARKUS_MAILER_USERNAME: ${SMTP_USERNAME:-}
      QUARKUS_MAILER_PASSWORD: ${SMTP_PASSWORD:-}
      QUARKUS_MAILER_START_TLS: ${SMTP_START_TLS:-REQUIRED}
      QUARKUS_MAILER_TLS: ${SMTP_TLS:-false}

  caddy:
    image: caddy:2-alpine
    container_name: papo-prod-caddy
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - backend
      - keycloak
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Mount the stable parent dir, not a directory that deploy replaces wholesale.
      # A bind mount is resolved once at container start; if the mounted path itself
      # gets swapped out (mv/rename) afterwards, Caddy keeps pointing at the old,
      # now-orphaned inode and serves an empty dir. frontend-live/ itself is never
      # replaced - only the `current` symlink inside it is repointed per deploy
      # (see .github/workflows/ci-cd.yml), which Caddy resolves fresh on every request.
      - ./frontend-live:/srv/frontend-live:ro
      - papo-caddy-data:/data
      - papo-caddy-config:/config

volumes:
  papo-postgres-data:
  papo-caddy-data:
  papo-caddy-config:
