<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>PAPO</title>
  <link rel="stylesheet" href="/src/styles/base.css" />
  <script src="/vendor/lucide-1.23.0.min.js"></script>
  <script type="module" src="/src/lib/router.js"></script>
</head>
<body>
  <div class="app-shell app-shell--bare" id="app-shell">
    <div class="app-shell__backdrop" id="app-backdrop"></div>
    <aside class="app-sidebar">
      <div class="app-sidebar__brand">
        <div class="app-sidebar__wordmark">PAPO</div>
        <div class="app-sidebar__role" id="app-role"></div>
      </div>
      <nav class="app-sidebar__nav" id="app-nav"></nav>
    </aside>
    <div class="app-main">
      <header class="app-topbar">
        <button type="button" class="app-topbar__menu-toggle" id="nav-toggle" aria-label="Menü öffnen" aria-expanded="false">
          <i data-lucide="menu"></i>
        </button>
        <div id="app-user"></div>
      </header>
      <main class="app-root" id="app-root">
        <!-- router mounts the current page's Web Component here -->
      </main>
    </div>
  </div>

  <div id="toast-root"></div>
</body>
</html>
