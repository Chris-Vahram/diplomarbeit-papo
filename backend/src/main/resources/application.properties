# FR-20: every endpoint must declare its required role explicitly (docs/CONVENTIONS.md);
# this is the fail-closed backstop if one is ever added without @RolesAllowed.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Caps request bodies at ~2 MB, matching the product-image upload size limit
# (ProductImageValidator) - rejects oversized multipart uploads before they're buffered.
quarkus.http.limits.max-body-size=2200K

# Schema management: Hibernate auto-generation for this prototype (no Flyway).
# dev/test = drop-and-create + programmatic seed via DemoDataSeeder (throwaway data);
# prod/demo = update (demo data survives restarts, no auto-seed).
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

# CORS: dev-only. The dev frontend is served as a separate static site (see docs/SETUP.md),
# so the browser calls http://localhost:8080/api cross-origin. In %prod, Caddy serves
# frontend and backend from the same origin (design.md Decision 1) - no CORS needed there,
# so these stay %dev-scoped rather than extended to a prod origin.
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:3000,http://127.0.0.1:3000
%dev.quarkus.http.cors.headers=accept,authorization,content-type
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# --- Dev + demo: fixed containers from docker-compose.yml (run `docker compose up -d` first). ---
# The frontend fetches tokens from the compose Keycloak on :8081; the backend must validate
# against the SAME issuer, so dev does NOT use OIDC/Postgres Dev Services (tests do, see below).
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=partnerportal
%dev.quarkus.datasource.password=partnerportal
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/partnerportal
%dev.quarkus.oidc.auth-server-url=http://localhost:8081/realms/partnerportal
%dev.quarkus.oidc.client-id=partnerportal-frontend

# Overridable via env vars (DB_USERNAME/DB_PASSWORD/DB_JDBC_URL/OIDC_AUTH_SERVER_URL) so a real
# deployment doesn't silently ship the demo defaults; defaults keep the demo target runnable as-is.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.oidc.auth-server-url=${KC_URL}
%prod.quarkus.oidc.client-id=${KC_CLIENT_ID}
# KC_URL is the internal Compose service address (quarkus reaches Keycloak container-to-container,
# not through the Caddy proxy) - but Keycloak's own KC_HOSTNAME makes it stamp tokens with the
# externally-visible issuer (the public domain, behind /auth). Without this override, Quarkus
# would reject every token: discovery says one issuer (internal), the token says another (public).
# Defaults to KC_URL itself so this still works before a real domain exists (docker-compose.prod.yml
# tested straight against the keycloak service, no Caddy in front).
%prod.quarkus.oidc.token.issuer=${KC_ISSUER:${KC_URL}}
# OIDC discovery would fetch /.well-known/openid-configuration from KC_URL (internal), but
# Keycloak's own KC_HOSTNAME makes it return *external* absolute URLs (jwks_uri etc.) in that
# document - the backend would then try to fetch e.g. https://<domain>/... from inside the
# container network, which doesn't route there (confirmed live: this breaks token validation
# end-to-end). Skip discovery and fetch JWKS directly from the internal auth-server-url instead.
%prod.quarkus.oidc.discovery-enabled=false
%prod.quarkus.oidc.jwks-path=protocol/openid-connect/certs

# --- Tests: Quarkus Dev Services provision throwaway Postgres + Keycloak containers ---
# (no datasource/auth-server url set in %test on purpose; realm import matches the compose one).
%test.quarkus.keycloak.devservices.realm-path=keycloak/partnerportal-realm.json
%test.quarkus.oidc.client-id=partnerportal-frontend
# Query-count assertions (e.g. KundeServiceTest's no-N+1 check) need Hibernate statistics on.
%test.quarkus.hibernate-orm.statistics=true
