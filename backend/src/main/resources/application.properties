# FR-20: every endpoint must declare its required role explicitly (docs/CONVENTIONS.md);
# this is the fail-closed backstop if one is ever added without @RolesAllowed.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Caps request bodies at ~2 MB, matching the product-image upload size limit
# (ProductImageValidator) - rejects oversized multipart uploads before they're buffered.
quarkus.http.limits.max-body-size=2200K

# Schema management: Hibernate auto-generation for this prototype (no Flyway).
# dev/test = drop-and-create + programmatic seed via DemoDataSeeder (throwaway data);
# prod/demo = update (demo data survives restarts, no auto-seed).
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

# CORS: the frontend is served as a separate static site (see docs/SETUP.md), so the browser
# calls http://localhost:8080/api cross-origin. Localhost-only; prototype setting.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://127.0.0.1:3000
quarkus.http.cors.headers=accept,authorization,content-type
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# --- Dev + demo: fixed containers from docker-compose.yml (run `docker compose up -d` first). ---
# The frontend fetches tokens from the compose Keycloak on :8081; the backend must validate
# against the SAME issuer, so dev does NOT use OIDC/Postgres Dev Services (tests do, see below).
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=partnerportal
%dev.quarkus.datasource.password=partnerportal
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/partnerportal
%dev.quarkus.oidc.auth-server-url=http://localhost:8081/realms/partnerportal
%dev.quarkus.oidc.client-id=partnerportal-frontend

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=partnerportal
%prod.quarkus.datasource.password=partnerportal
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/partnerportal
%prod.quarkus.oidc.auth-server-url=http://localhost:8081/realms/partnerportal
%prod.quarkus.oidc.client-id=partnerportal-frontend

# --- Tests: Quarkus Dev Services provision throwaway Postgres + Keycloak containers ---
# (no datasource/auth-server url set in %test on purpose; realm import matches the compose one).
%test.quarkus.keycloak.devservices.realm-path=keycloak/partnerportal-realm.json
%test.quarkus.oidc.client-id=partnerportal-frontend
