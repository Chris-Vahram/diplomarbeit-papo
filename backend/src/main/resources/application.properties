# FR-20: every endpoint must declare its required role explicitly (docs/CONVENTIONS.md);
# this is the fail-closed backstop if one is ever added without @RolesAllowed.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Public shop (add-partner-shop-foundation): /api/shop/* is the only unauthenticated API, plus
# the bundled template sample photos (/api/shop-templates/images/*, add-shop-templates).
# The explicit permit entry documents that; PublicShopResource is @PermitAll, every other
# endpoint stays @RolesAllowed and deny-unannotated still applies.
quarkus.http.auth.permission.shop-public.paths=/api/shop/*,/api/shop-templates/images/*
quarkus.http.auth.permission.shop-public.policy=permit
# Kill switch for every public shop route (/shop/*, /api/shop/*). Default off: each merge into
# main deploys to the only, public VM, so shops stay unreachable there until the legal texts
# (add-shop-legal-consent) are live. Company/partner shop management works either way.
# Enable per environment with SHOP_PUBLIC_ENABLED=true; dev and test enable it.
papo.shop.public-enabled=${SHOP_PUBLIC_ENABLED:false}
%dev.papo.shop.public-enabled=${SHOP_PUBLIC_ENABLED:true}
%test.papo.shop.public-enabled=true
# In-memory per-IP token bucket; IPs are never persisted. One rendered page costs about five API
# calls plus one per article image, and visitors may share an IP (NAT), hence 300 per minute.
# Tests keep 60 so the limit test stays fast.
papo.shop.rate-limit.requests-per-minute=${SHOP_RATE_LIMIT_PER_MINUTE:300}
%test.papo.shop.rate-limit.requests-per-minute=60
# Sending shop inquiries per client IP (add-shop-inquiries), on top of the general limit.
papo.shop.inquiry-rate-limit.per-minute=${SHOP_INQUIRY_RATE_LIMIT_PER_MINUTE:5}
# Search engines stay out unless a deployment explicitly opts in; staging never sets this.
# Scope: API responses only. Shop pages keep a fixed noindex (Caddy header + meta tag in
# shop.html) until a later change enables page indexing for released live shops.
papo.shop.indexing-enabled=${SHOP_INDEXING_ENABLED:false}

# Proof files are capped at 10 MiB; 11 MiB leaves measured room for multipart
# headers and the mapping part. Import files and product images keep their own 2 MiB limits.
quarkus.http.limits.max-body-size=11264K

# Opt-in demo seeding under LaunchMode.NORMAL (packaged/deployed runs, e.g. the VM) - off by
# default so real deployments never auto-seed; set SEED_DEMO_DATA=true only in a VM's .env.prod
# (docs/DEPLOYMENT.md). No profile prefix so it can be set for %prod without affecting %dev/%test,
# which seed unconditionally via LaunchMode regardless of this flag (DemoDataSeeder.onStart()).
papo.seed-demo-data=${SEED_DEMO_DATA:false}

# Schema management: Hibernate auto-generation for this prototype (no Flyway).
# dev/test = drop-and-create + programmatic seed via DemoDataSeeder (throwaway data);
# prod/demo = update (demo data survives restarts, no auto-seed).
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

# CORS: dev-only. The dev frontend is served as a separate static site (see docs/SETUP.md),
# so the browser calls http://localhost:8080/api cross-origin. In %prod, Caddy serves
# frontend and backend from the same origin (design.md Decision 1) - no CORS needed there,
# so these stay %dev-scoped rather than extended to a prod origin.
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:3000,http://127.0.0.1:3000
%dev.quarkus.http.cors.headers=accept,authorization,content-type
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# --- Dev + demo: fixed containers from docker-compose.yml (run `docker compose up -d` first). ---
# The frontend fetches tokens from the compose Keycloak on :8081; the backend must validate
# against the SAME issuer, so dev does NOT use OIDC/Postgres Dev Services (tests do, see below).
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=partnerportal
%dev.quarkus.datasource.password=partnerportal
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/partnerportal
%dev.quarkus.oidc.auth-server-url=http://localhost:8081/realms/partnerportal
%dev.quarkus.oidc.client-id=partnerportal-frontend

# Overridable via env vars (DB_USERNAME/DB_PASSWORD/DB_JDBC_URL/OIDC_AUTH_SERVER_URL) so a real
# deployment doesn't silently ship the demo defaults; defaults keep the demo target runnable as-is.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.oidc.auth-server-url=${KC_URL}
%prod.quarkus.oidc.client-id=${KC_CLIENT_ID}
# KC_URL is the internal Compose service address (quarkus reaches Keycloak container-to-container,
# not through the Caddy proxy) - but Keycloak's own KC_HOSTNAME makes it stamp tokens with the
# externally-visible issuer (the public domain, behind /auth). Without this override, Quarkus
# would reject every token: discovery says one issuer (internal), the token says another (public).
# Defaults to KC_URL itself so this still works before a real domain exists (docker-compose.prod.yml
# tested straight against the keycloak service, no Caddy in front).
%prod.quarkus.oidc.token.issuer=${KC_ISSUER:${KC_URL}}
# OIDC discovery would fetch /.well-known/openid-configuration from KC_URL (internal), but
# Keycloak's own KC_HOSTNAME makes it return *external* absolute URLs (jwks_uri etc.) in that
# document - the backend would then try to fetch e.g. https://<domain>/... from inside the
# container network, which doesn't route there (confirmed live: this breaks token validation
# end-to-end). Skip discovery and fetch JWKS directly from the internal auth-server-url instead.
%prod.quarkus.oidc.discovery-enabled=false
%prod.quarkus.oidc.jwks-path=protocol/openid-connect/certs

# --- Tests: Quarkus Dev Services provision throwaway Postgres + Keycloak containers ---
# (no datasource/auth-server url set in %test on purpose; realm import matches the compose one).
%test.quarkus.keycloak.devservices.realm-path=keycloak/partnerportal-realm.json
# Docker Desktop may present host requests with a public source IP; keep Keycloak's frontend
# secure while its dynamic backchannel remains reachable through Testcontainers' mapped HTTP port.
%test.quarkus.keycloak.devservices.container-env.KC_HOSTNAME=https://localhost
%test.quarkus.keycloak.devservices.container-env.KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
%test.quarkus.keycloak.devservices.web-client-timeout=30s
%test.quarkus.oidc.client-id=partnerportal-frontend
%test.quarkus.oidc.token.issuer=https://localhost/realms/partnerportal
# Query-count assertions (e.g. KundeServiceTest's no-N+1 check) need Hibernate statistics on.
%test.quarkus.hibernate-orm.statistics=true

# --- Order e-mails (send-order-emails, B-04) ---
# Off by default everywhere; the VM enables it only via env (PAPO_MAIL_*, QUARKUS_MAILER_*).
# Without papo.mail.redirect-to, enabling also needs papo.mail.allow-real-recipients=true
# (the demo VM must only send to a test inbox). Mock mode would log full mails at INFO,
# so the mailer category stays at WARN in all profiles (no addresses/bodies in logs).
quarkus.log.category."quarkus-mailer".level=WARN
quarkus.log.category."io.quarkus.mailer".level=WARN
quarkus.mailer.mock=false
# Dev: Mailpit from docker-compose.yml (SMTP 127.0.0.1:1025, web UI http://localhost:8025).
%dev.quarkus.mailer.host=localhost
%dev.quarkus.mailer.port=1025
%dev.papo.mail.enabled=true
%dev.papo.mail.allow-real-recipients=true
%dev.papo.mail.shipping-enabled=true
%dev.papo.mail.from=PAPO Partnerportal <noreply@papo.localhost>
# Tests: MockMailbox, scheduler off (tests call OrderEmailSender.sendDue() directly).
%test.quarkus.mailer.mock=true
%test.quarkus.scheduler.enabled=false
%test.papo.mail.enabled=true
%test.papo.mail.allow-real-recipients=true
%test.papo.mail.shipping-enabled=true
%test.papo.mail.from=PAPO Test <noreply@example.test>
