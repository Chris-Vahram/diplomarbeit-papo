schema: spec-driven

context: |
  Project: Web-based Partner Portal (HTL Diplomarbeit). Model: Company -> Partner -> End Customer.
  Authoritative spec: Specification/functional_specification_document_partnerportal_final.md (v2).
  Plan: Specification/IMPLEMENTATION_PLAN.md. Backlog: Specification/phase2_backlog.md.
  MVP = INTERNAL B2B partner-ordering portal (partner logs in, selects/creates Endkunde, places order
  with articles+quantities on the customer's behalf). NOT an external end-customer shop.

  Fixed tech stack (NO alternatives allowed):
    - Frontend: HTML, CSS, native Web Components / Custom Elements (no framework)
    - Backend: Quarkus (Java)
    - Database: PostgreSQL
    - Auth: Keycloak (roles: company, partner)

  Scale reference: ~200 partners, ~800 articles. Data enters via Excel/CSV import (no BMD interface).
  Current MVP commission: field on Partner (Partner.commissionPercent), company sets via dropdown 5/10/15 +
  optional custom value; percentage of total order value; stored as own CommissionRecord. B-03 automatic
  Partner-company commission level-up remains deferred. B-09 employee team commissions, points, career
  levels and bonuses are reopened for planning; see Specification/TEAM_COMMISSION_DISCOVERY.md. Its formulas
  and payment rules still need company approval. Chris confirmed one existing order-commission budget,
  internal allocation/display first and accepted recommendations as planning direction on 2026-10-06,
  not company approval of recipients, rights, formulas or settlement. B-09 is not implementation-ready;
  do not create its artifacts from unanswered company questions. Keep employee career levels separate from B-03.
  Context sync on 2026-10-07 changes documentation/presentations only, not application scope or approval.
  Sole operative handoff: Specification/CONTINUATION_PROMPT.md; full desired scope: Specification/PRODUCT_COMPLETION_PLAN.md.
  Separate general/sprint decks and evidence: presentation/README.md. Eight B-09 company decision groups
  remain unanswered; no new company meeting or approval confirmed. Next independent planning candidate:
  OIDC identity foundation, separate from BMD-number rules; no automatic implementation authorization.
  Active status: DB-only flag Partner.active, enforced server-side after login (Keycloak stays simple).
  Order status: submitted -> reviewed -> fulfilled (company-controlled). Confirmations simulated in-app (no real email).
  Team: Chris + Tobias only (Julian left).

  DEFERRED / OUT OF MVP (see phase2_backlog.md; scope only into a requested Phase-2 change):
    B-01 external partner shop + direct end-customer ordering
    B-02 shop design customization
    B-03 automatic commission level-up
    B-04 real email sending
    B-05 shop inquiry auto-forward
    B-06 BMD interface (reopened; not approved)
    B-07 commission settlement/payout
    B-09 employee team commissions, points, career levels and bonuses (planning open)

# Per-artifact rules (optional)
rules:
  proposal:
    - Match the explicitly requested change scope; distinguish implemented MVP from requested Phase 2.
    - For B-09 use Specification/TEAM_COMMISSION_DISCOVERY.md; do not turn recommendations or open rules into decisions.
  tasks:
    - Organize tasks into phases; mark essential vs optional; realistic for a 2-person school project.
    - Use only the fixed tech stack.

