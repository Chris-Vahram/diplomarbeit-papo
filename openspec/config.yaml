schema: spec-driven

context: |
  PAPO is an existing extensible B2B partner-ordering portal (brownfield).
  Source priority and document routing are defined in AGENTS.md; read only the sources relevant to the active change.
  Current core: Company -> Partner -> End Customer; one shared organizational login per partner company.
  UI/thesis term: Artikel. BMD leads article master data; PAPO currently imports Excel/CSV only.
  Stack: static HTML/CSS/JavaScript with native Web Components; Java 21/Quarkus/Panache/OIDC;
  PostgreSQL; Keycloak roles company and partner. Money uses BigDecimal/numeric and frontend integer cents.
  Protect role and partner/tenant boundaries. Never expose secrets or real private data.
  Deferred scope is listed in Specification/phase2_backlog.md and must not enter a current change implicitly.

rules:
  proposal:
    - One feature or concern per change; update an existing change when the objective is the same.
    - State source requirements, scope, non-goals, assumptions, and unresolved decisions.
    - Do not regenerate the whole FSD or create a mega-change for general FSD synchronization.
  design:
    - Record architecture, security, data, deployment, rollback, and compatibility decisions that affect this change.
    - Prefer the smallest design consistent with the fixed stack and existing conventions.
  tasks:
    - Order tasks by dependency and make each task independently verifiable.
    - For every task state objective, prerequisites, affected files, exact check, definition of done, and stop condition.
    - Keep implementation, verification, documentation, and archive work explicit.
